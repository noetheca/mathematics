      <path d="M0 0 L10 5 L0 10 Z" fill="#172033"/>
    </marker>
  </defs>
  <path d="M105 265 L220 75 L625 75 L510 265 Z" fill="#eef4ff" stroke="#60708d" stroke-width="3"/>
  <line x1="145" y1="254" x2="595" y2="92" stroke="#172033" stroke-width="4" marker-start="url(#line-arrow)" marker-end="url(#line-arrow)"/>
  <circle cx="290" cy="202" r="7" fill="#b42318"/>
  <circle cx="455" cy="143" r="7" fill="#b42318"/>
