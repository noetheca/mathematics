<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" role="img" aria-labelledby="title desc">
  <title id="title">直線、線分、半直線</title>
  <desc id="desc">上段はA、B、Cが順に並ぶ直線、中段は端点AとCをもつ線分、下段はAからBを通って右へ続く半直線。</desc>
  <rect width="760" height="330" fill="#ffffff"/>
  <g font-family="sans-serif" font-size="22" fill="#172033" stroke="#172033" stroke-width="4">
  <text x="30" y="70" stroke="none">ちょくせん</text>
    <line x1="130" y1="62" x2="690" y2="62"/>
    <path d="M130 62 L150 50 M130 62 L150 74 M690 62 L670 50 M690 62 L670 74" fill="none"/>
    <circle cx="270" cy="62" r="7" fill="#b42318" stroke="none"/><text x="260" y="100" stroke="none">A</text>
    <circle cx="410" cy="62" r="7" fill="#b42318" stroke="none"/><text x="400" y="100" stroke="none">B</text>
    <circle cx="550" cy="62" r="7" fill="#b42318" stroke="none"/><text x="540" y="100" stroke="none">C</text>
  <text x="30" y="180" stroke="none">せんぶん AC</text>
    <line x1="270" y1="170" x2="550" y2="170"/>
    <circle cx="270" cy="170" r="8" fill="#b42318" stroke="none"/><text x="260" y="208" stroke="none">A</text>
    <circle cx="550" cy="170" r="8" fill="#b42318" stroke="none"/><text x="540" y="208" stroke="none">C</text>
  <text x="30" y="285" stroke="none">はんちょくせん AB</text>
    <line x1="270" y1="275" x2="690" y2="275"/>
    <path d="M690 275 L670 263 M690 275 L670 287" fill="none"/>
    <circle cx="270" cy="275" r="8" fill="#b42318" stroke="none"/><text x="260" y="315" stroke="none">A</text>
    <circle cx="410" cy="275" r="7" fill="#b42318" stroke="none"/><text x="400" y="315" stroke="none">B</text>
  </g>
</svg>
