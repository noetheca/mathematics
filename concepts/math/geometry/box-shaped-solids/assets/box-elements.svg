<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 430">
  <title>箱の形の面・辺・頂点</title>
  <desc>箱の形を立体的に描き、面、辺、頂点を矢印で示した図</desc>
  <rect width="700" height="430" rx="18" fill="#f8fafc"/>
  <path d="M165 145 L405 145 L535 65 L295 65 Z" fill="#dbeafe" stroke="#1d4ed8" stroke-width="6" stroke-linejoin="round"/>
  <path d="M405 145 L535 65 V285 L405 365 Z" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="6" stroke-linejoin="round"/>
  <path d="M165 145 H405 V365 H165 Z" fill="#eff6ff" stroke="#1d4ed8" stroke-width="6" stroke-linejoin="round"/>
  <circle cx="405" cy="145" r="10" fill="#dc2626"/>
