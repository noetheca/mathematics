  <text x="28" y="79" font-size="24" fill="#0f172a">へん</text>
  <path d="M600 95 L425 140" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="570" y="98" font-size="24" fill="#0f172a">ちょうてん</text>
