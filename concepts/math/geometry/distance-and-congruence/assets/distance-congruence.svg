<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340" role="img" aria-labelledby="title desc">
  <title id="title">同じ長さの二つの線分</title>
  <desc id="desc">横向きの線分ABと斜め向きの線分CDはいずれも4センチメートルで、同じ一本の印が付いている。</desc>
  <rect width="760" height="340" fill="#ffffff"/>
  <g stroke="#172033" stroke-width="5" fill="none" stroke-linecap="round">
    <line x1="120" y1="105" x2="440" y2="105"/>
    <line x1="260" y1="92" x2="274" y2="118" stroke="#b42318"/>
    <line x1="330" y1="270" x2="586" y2="78"/>
    <line x1="449" y1="162" x2="467" y2="186" stroke="#b42318"/>
  </g>
  <g fill="#b42318">
    <circle cx="120" cy="105" r="7"/><circle cx="440" cy="105" r="7"/>
    <circle cx="330" cy="270" r="7"/><circle cx="586" cy="78" r="7"/>
  </g>
  <g font-family="sans-serif" font-size="24" fill="#172033">
    <text x="100" y="92">A</text><text x="448" y="92">B</text><text x="230" y="65">4 cm</text>
    <text x="305" y="302">C</text><text x="594" y="74">D</text><text x="480" y="220">4 cm</text>
  </g>
</svg>
