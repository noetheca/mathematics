<svg xmlns="http://www.w3.org/2000/svg" width="760" height="350" viewBox="0 0 760 350" role="img" aria-labelledby="title desc">
  <title id="title">角と直角</title>
  <desc id="desc">左は頂点OからAとBへ伸びる二つの半直線が作る角、右は直角記号を付けた角。</desc>
  <rect width="760" height="350" fill="#ffffff"/>
  <defs>
    <marker id="ray-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#172033"/>
    </marker>
  </defs>
  <g stroke="#172033" stroke-width="5" fill="none" stroke-linecap="round">
    <line x1="180" y1="255" x2="360" y2="255" marker-end="url(#ray-arrow)"/>
    <line x1="180" y1="255" x2="306" y2="75" marker-end="url(#ray-arrow)"/>
    <path d="M235 255 A55 55 0 0 0 212 210" stroke="#2b6cb0" stroke-width="4"/>
    <line x1="500" y1="255" x2="675" y2="255" marker-end="url(#ray-arrow)"/>
    <line x1="500" y1="255" x2="500" y2="75" marker-end="url(#ray-arrow)"/>
    <path d="M500 215 L540 215 L540 255" stroke="#2b6cb0" stroke-width="4"/>
  </g>
  <g fill="#b42318">
    <circle cx="180" cy="255" r="7"/><circle cx="335" cy="255" r="7"/><circle cx="285" cy="105" r="7"/>
    <circle cx="500" cy="255" r="7"/><circle cx="650" cy="255" r="7"/><circle cx="500" cy="105" r="7"/>
  </g>
  <g font-family="sans-serif" font-size="24" fill="#172033">
  <text x="160" y="290">O</text><text x="342" y="263">A</text><text x="288" y="98">B</text><text x="200" y="65">かく ∠AOB</text>
  <text x="480" y="290">O</text><text x="657" y="263">A</text><text x="510" y="98">B</text><text x="530" y="65">ちょっかく</text>
  </g>
</svg>
