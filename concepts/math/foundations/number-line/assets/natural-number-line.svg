<svg xmlns="http://www.w3.org/2000/svg" width="760" height="180" viewBox="0 0 760 180" role="img" aria-labelledby="title desc">
  <title id="title">0から6までの自然数の数直線</title>
  <desc id="desc">等しい間隔の目盛りに0から6までを置き、右向きの矢印で数が大きくなる向きを示す。</desc>
  <rect width="760" height="180" fill="#ffffff"/>
  <line x1="70" y1="90" x2="700" y2="90" stroke="#172033" stroke-width="4"/>
  <path d="M700 90 L680 78 M700 90 L680 102" fill="none" stroke="#172033" stroke-width="4" stroke-linecap="round"/>
  <g stroke="#172033" stroke-width="3" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#172033">
    <line x1="90" y1="72" x2="90" y2="108"/><text x="90" y="142" stroke="none">0</text>
    <line x1="185" y1="72" x2="185" y2="108"/><text x="185" y="142" stroke="none">1</text>
    <line x1="280" y1="72" x2="280" y2="108"/><text x="280" y="142" stroke="none">2</text>
    <line x1="375" y1="72" x2="375" y2="108"/><text x="375" y="142" stroke="none">3</text>
    <line x1="470" y1="72" x2="470" y2="108"/><text x="470" y="142" stroke="none">4</text>
    <line x1="565" y1="72" x2="565" y2="108"/><text x="565" y="142" stroke="none">5</text>
    <line x1="660" y1="72" x2="660" y2="108"/><text x="660" y="142" stroke="none">6</text>
  </g>
  <text x="580" y="44" font-family="sans-serif" font-size="20" fill="#172033">おおきくなるほう</text>
</svg>
