<svg xmlns="http://www.w3.org/2000/svg" width="560" height="340" viewBox="0 0 560 340" role="img">
  <title>球の中心、半径、直径、切り口</title>
  <desc>球の中心Oを通る直径、中心から表面までの半径、円形の切り口を示す。</desc>
  <rect width="560" height="340" fill="#ffffff"/>
  <circle cx="280" cy="170" r="130" fill="#eff6ff" stroke="#1e3a8a" stroke-width="4"/>
  <ellipse cx="280" cy="170" rx="130" ry="48" fill="none" stroke="#64748b" stroke-width="3" stroke-dasharray="10 7"/>
  <line x1="150" y1="170" x2="410" y2="170" stroke="#166534" stroke-width="4"/>
  <line x1="280" y1="170" x2="356" y2="65" stroke="#b91c1c" stroke-width="4"/>
  <circle cx="280" cy="170" r="6" fill="#111827"/>
  <text x="289" y="193" font-size="20" fill="#111827">O</text>
  <text x="315" y="106" font-size="18" fill="#b91c1c">はんけい</text>
  <text x="252" y="158" font-size="18" fill="#166534">ちょっけい</text>
  <text x="390" y="218" font-size="18" fill="#475569">切り口</text>
</svg>
