<svg xmlns="http://www.w3.org/2000/svg" width="560" height="320" viewBox="0 0 560 320" role="img">
  <title>円の中心、半径、直径</title>
  <desc>中心Oの円に、中心から円周上のAまでの半径と、中心を通るBからCまでの直径を示す。</desc>
  <rect width="560" height="320" fill="#ffffff"/>
  <circle cx="280" cy="160" r="120" fill="#eef2ff" stroke="#1e3a8a" stroke-width="4"/>
  <line x1="280" y1="160" x2="376" y2="88" stroke="#b91c1c" stroke-width="4"/>
  <line x1="160" y1="160" x2="400" y2="160" stroke="#166534" stroke-width="4"/>
  <circle cx="280" cy="160" r="6" fill="#111827"/>
  <text x="286" y="184" font-size="20" fill="#111827">O</text>
  <text x="384" y="88" font-size="20" fill="#b91c1c">A</text>
  <text x="140" y="154" font-size="20" fill="#166534">B</text>
  <text x="408" y="154" font-size="20" fill="#166534">C</text>
  <text x="326" y="112" font-size="18" fill="#b91c1c">はんけい</text>
  <text x="250" y="146" font-size="18" fill="#166534">ちょっけい</text>
</svg>
