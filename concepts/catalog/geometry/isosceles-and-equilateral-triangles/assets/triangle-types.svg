  <path d="M571.1 122.6 L558.9 129.6 M576.1 131.2 L563.9 138.2" stroke="#14532d" stroke-width="4"/>
  <path d="M506 221 v14 M516 221 v14" stroke="#14532d" stroke-width="4"/>
