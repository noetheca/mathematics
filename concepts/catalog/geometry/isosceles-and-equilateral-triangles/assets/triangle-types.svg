  <path d="M106 151 l14 10" stroke="#1e3a8a" stroke-width="4"/>
  <path d="M234 161 l14 -10" stroke="#1e3a8a" stroke-width="4"/>
  <text x="510" y="36" text-anchor="middle" font-size="20" fill="#111827">正三角形</text>
  <path d="M395 230 L510 30.814157 L625 230 Z" fill="#dcfce7" stroke="#14532d" stroke-width="4"/>
