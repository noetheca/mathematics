<svg xmlns="http://www.w3.org/2000/svg" width="600" height="360" viewBox="0 0 600 360" role="img">
  <title>一目盛二人の棒グラフ</title>
  <desc>Aは六人、Bは四人、Cは八人を表す三本の棒グラフ。</desc>
  <rect width="600" height="360" fill="#ffffff"/>
  <line x1="90" y1="40" x2="90" y2="300" stroke="#111827" stroke-width="3"/>
  <line x1="90" y1="300" x2="550" y2="300" stroke="#111827" stroke-width="3"/>
  <g stroke="#cbd5e1" stroke-width="2">
    <line x1="90" y1="250" x2="550" y2="250"/>
    <line x1="90" y1="200" x2="550" y2="200"/>
    <line x1="90" y1="150" x2="550" y2="150"/>
    <line x1="90" y1="100" x2="550" y2="100"/>
  </g>
  <g fill="#111827" font-size="18">
    <text x="58" y="306">0</text>
    <text x="58" y="256">2</text>
    <text x="58" y="206">4</text>
    <text x="58" y="156">6</text>
    <text x="58" y="106">8</text>
    <text x="190" y="330">A</text>
    <text x="315" y="330">B</text>
    <text x="440" y="330">C</text>
    <text x="18" y="55">人</text>
  </g>
  <rect x="160" y="150" width="70" height="150" fill="#60a5fa" stroke="#1e3a8a" stroke-width="3"/>
  <rect x="285" y="200" width="70" height="100" fill="#86efac" stroke="#166534" stroke-width="3"/>
  <rect x="410" y="100" width="70" height="200" fill="#fbbf24" stroke="#92400e" stroke-width="3"/>
</svg>
