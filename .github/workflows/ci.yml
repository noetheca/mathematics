name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    steps:
      - name: Check out mathematics
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: mathematics
      - name: Check out knowledge engine
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: noetheca/knowledge-engine
          path: knowledge-engine
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: mathematics/.node-version
          package-manager-cache: false
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.9.0 --activate
      - name: Install engine dependencies
        run: pnpm --dir knowledge-engine install --frozen-lockfile
      - name: Install domain dependencies
        run: pnpm --dir mathematics install --frozen-lockfile
      - name: Run checks
        run: pnpm --dir mathematics check
